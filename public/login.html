<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — PMCweb</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body class="center">
  <form id="login-form" class="card" action="/api/auth/login" method="post" novalidate>
    <h1>Đăng nhập</h1>
    <label>Tên đăng nhập
      <input name="username" autocomplete="username" required maxlength="50">
      <small class="field-error" data-error-for="username"></small>
    </label>
    <label>Mật khẩu
      <input name="password" type="password" autocomplete="current-password" required>
      <small class="field-error" data-error-for="password"></small>
    </label>
    <p class="form-error" id="form-error"></p>
    <button type="submit">Đăng nhập</button>
  </form>
  <script type="module">
    import { init } from '/js/pages/login.js';
    init();
  </script>
</body>
</html>
